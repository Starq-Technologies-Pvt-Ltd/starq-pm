name: starq-pm
version: 0.1.0
description: Software project management for Hermes agent floors — stage-gated lifecycle, independent verification, flow measurement, hash-chained audit. Identity-agnostic; stdlib-only.
author: Starq Technologies Pvt Ltd
kind: standalone
provides_tools:
  - starq_pm_initiate
  - starq_pm_requirements
  - starq_pm_plan
  - starq_pm_execute
  - starq_pm_verify
  - starq_pm_gates
  - starq_pm_change
  - starq_pm_risk
  - starq_pm_report
  - starq_pm_close
  - starq_pm_config
  - starq_pm_audit
# capabilities: none declared — fail-closed default (SDK-11, NFR-11)
# python_dependencies: none — stdlib only (SDK-13, NFR-05)
# requires_env: none — no secrets needed
# plugins: none — zero runtime dependencies (D4-DEC-01 Option B, NFR-07)
